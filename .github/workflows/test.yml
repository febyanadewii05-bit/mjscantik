name: Test and Deploy Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Bash Script Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt update
          sudo apt install shellcheck -y

      - name: Linting
        run: shellcheck scripts/test.sh

      - name: Execute Bash Test
        run: bash scripts/test.sh

  deploy:
    name: Package Project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Package
        run: |
          tar -czf mjscantik.tar.gz \
            --exclude=.git \
            .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mjscantik-package
          path: mjscantik.tar.gz
