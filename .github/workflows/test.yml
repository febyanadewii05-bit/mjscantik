name: Test Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Bash Script Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt update
          sudo apt install shellcheck -y

      - name: Linting
        run: shellcheck scripts/test.sh

      - name: Execute Bash Test
        run: bash scripts/test.sh
